apiVersion: 1

providers:
  - name: Cairn
    orgId: 1
    folder: Cairn
    type: file
    disableDeletion: false
    # Les dashboards sont versionnés dans le repo : on les recharge depuis le
    # disque plutôt que de les éditer dans l'interface.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
