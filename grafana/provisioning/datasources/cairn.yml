apiVersion: 1

datasources:
  - name: Cairn
    type: postgres
    uid: cairn-postgres
    access: proxy
    url: db:5432
    database: cairn
    user: cairn
    isDefault: true
    editable: false
    secureJsonData:
      password: ${CAIRN_DB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
      maxOpenConns: 5
      maxIdleConns: 2
