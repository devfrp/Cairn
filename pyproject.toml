[project]
name = "cairn"
version = "0.1.0"
description = "Agrégation auto-hébergée des données Garmin et Strava"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "garth>=0.5",
    "fitdecode>=0.10",
    "cryptography>=43",
    "structlog>=24.4",
    "apscheduler>=3.10,<4",
    "typer>=0.12",
]

[project.optional-dependencies]
# Qt n'est requis que par l'application de bureau. Le conteneur serveur s'en
# passe : ce sont plus de cent mégaoctets qui n'y serviraient à rien.
gui = [
    "PySide6-Essentials>=6.8",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
cairn = "cairn.__main__:main"

[project.gui-scripts]
cairn-gui = "cairn.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
