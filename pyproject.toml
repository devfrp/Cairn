[project]
name = "cairn"
version = "0.2.0"
description = "Agrégation auto-hébergée des données Garmin et Strava"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    # garth n'est plus maintenu depuis mars 2026 : version plafonnée pour que
    # la dernière publiée reste celle qui a été testée ici.
    "garth>=0.5,<0.9",
    "fitdecode>=0.10",
    "cryptography>=43",
    # Depuis la version 49, cryptography ne publie plus de binaire macOS que
    # pour Apple Silicon. Sur un Mac Intel, pip la recompile alors depuis les
    # sources et la lie à l'OpenSSL de la machine ; PyInstaller en embarque un
    # autre, et l'application meurt au lancement sur un symbole manquant. La
    # 48 reste fournie en binaire universel. Ce plafond ne vaut que là :
    # ailleurs, une bibliothèque de chiffrement doit rester à jour.
    "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "structlog>=24.4",
    "apscheduler>=3.10,<4",
    "typer>=0.12",
]

[project.optional-dependencies]
# Qt n'est requis que par l'application de bureau. Le conteneur serveur s'en
# passe : ce sont plus de cent mégaoctets qui n'y serviraient à rien.
gui = [
    "PySide6-Essentials>=6.8",
    # QtWebEngine, pour la fenêtre de connexion Garmin. Garmin refuse les
    # clients HTTP depuis mars 2026 : seul un vrai moteur de rendu passe.
    # C'est lourd — un Chromium — mais c'est le prix de la connexion.
    "PySide6-Addons>=6.8",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]
build = [
    "pyinstaller>=6.10",
    # Les archives Ollama récentes sont compressées en zstandard.
    "zstandard>=0.22",
]

[project.scripts]
cairn = "cairn.__main__:main"

[project.gui-scripts]
cairn-gui = "cairn.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
