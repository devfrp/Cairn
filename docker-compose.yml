services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: cairn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: cairn
      # Profil raisonnable pour une LXC partagée : la base reste petite,
      # inutile de réserver plusieurs Go sur un serveur qui héberge déjà
      # une demi-douzaine de services.
      TIMESCALEDB_TELEMETRY: "off"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=40
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G

  cairn:
    build: .
    container_name: cairn-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      CAIRN_DB_DSN: postgresql://cairn:${POSTGRES_PASSWORD}@db:5432/cairn
      CAIRN_FILE_ROOT: /data/activities
    volumes:
      - ./data/activities:/data/activities
    # `cairn scheduler` applique les migrations puis planifie la passe nocturne.
    # L'entrypoint étant `cairn`, les commandes ponctuelles s'écrivent
    #   docker compose run --rm cairn auth garmin
    command: ["scheduler"]
    deploy:
      resources:
        limits:
          memory: 1G

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: cairn-grafana
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD manquant dans .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      CAIRN_DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 512M
